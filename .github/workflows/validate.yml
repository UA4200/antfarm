name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Secret scan
        run: |
          FOUND=$(grep -rE "(sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)" src/ 2>/dev/null | grep -v "grep|echo|#" | head -5)
          [ -z "$FOUND" ] && echo "PASS: no secrets" || (echo "FAIL: $FOUND"; exit 1)
      - name: Install
        run: npm ci 2>&1 | tail -5
      - name: Type check
        run: npx tsc --noEmit 2>&1 | tail -10 || echo "TypeScript warnings (non-blocking)"
